<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicias Admin — Menu Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Cardo', serif;
            background-color: white;
            color: black;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        input, select, textarea {
            outline: none;
        }
    </style>
</head>
<body class="selection:bg-gray-200">

    <nav class="bg-white text-black shadow-sm sticky top-0 z-50 border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <span class="font-bold text-2xl tracking-widest uppercase">Delicias <span class="text-gray-500">Admin</span></span>
                <a href="index.html" class="uppercase tracking-wider text-xs font-bold hover:text-gray-600 transition-colors flex items-center gap-2">
                    <i data-lucide="arrow-left" class="h-4 w-4"></i> Back to Site
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-5xl mx-auto w-full px-4 py-12">
        <h1 class="text-4xl font-bold text-black mb-2 text-center uppercase tracking-widest">Menu Manager</h1>
        <p class="text-center text-sm text-black/60 mb-10 uppercase tracking-wider">Add items, set prices, remove items — changes go live immediately</p>

        <div id="status-banner" class="hidden mb-8 border border-black bg-gray-100 p-4 text-sm font-bold uppercase tracking-wider text-center"></div>

        <!-- Seed prompt (shown only when the collection is empty) -->
        <div id="seed-panel" class="hidden mb-12 border border-black p-6 bg-gray-100 text-center">
            <p class="font-bold uppercase tracking-wider mb-4">The database is empty. Load the current site menu as a starting point?</p>
            <button onclick="seedDefaults()" id="seed-btn" class="bg-black hover:bg-gray-800 text-white px-8 py-3 font-bold uppercase tracking-widest transition-colors">
                Load Default Menu
            </button>
        </div>

        <!-- Add item form -->
        <section class="border border-black p-6 mb-12">
            <h2 class="text-xl font-bold mb-6 uppercase tracking-wider">Add Item</h2>
            <form id="add-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider mb-1">Section</label>
                    <select id="add-type" class="w-full border border-black p-2 bg-white">
                        <option value="main">Entree (Main)</option>
                        <option value="side">Side</option>
                        <option value="appetizer">Appetizer</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider mb-1">Category</label>
                    <select id="add-category" class="w-full border border-black p-2 bg-white">
                        <option value="">None</option>
                        <option value="Mexican">Mexican</option>
                        <option value="BBQ">BBQ</option>
                        <option value="Italian">Italian</option>
                        <option value="American">American</option>
                        <option value="Continental">Continental</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider mb-1">Name</label>
                    <input type="text" id="add-name" required placeholder="e.g. Chicken Mole" class="w-full border border-black p-2">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider mb-1">Price ($ per plate)</label>
                    <input type="number" id="add-price" required min="0" step="0.5" placeholder="0.00" class="w-full border border-black p-2">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold uppercase tracking-wider mb-1">Description</label>
                    <input type="text" id="add-description" placeholder="Short description shown on the menu" class="w-full border border-black p-2">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" id="add-btn" class="w-full bg-black hover:bg-gray-800 text-white py-3 font-bold uppercase tracking-widest transition-colors">
                        Add to Menu
                    </button>
                </div>
            </form>
        </section>

        <!-- Item lists -->
        <section class="mb-12">
            <h2 class="text-2xl font-bold border-b-2 border-black pb-2 mb-6 uppercase tracking-widest">Entrees</h2>
            <div id="list-main" class="space-y-3"></div>
        </section>
        <section class="mb-12">
            <h2 class="text-2xl font-bold border-b-2 border-black pb-2 mb-6 uppercase tracking-widest">Sides</h2>
            <div id="list-side" class="space-y-3"></div>
        </section>
        <section class="mb-12">
            <h2 class="text-2xl font-bold border-b-2 border-black pb-2 mb-6 uppercase tracking-widest">Appetizers</h2>
            <div id="list-appetizer" class="space-y-3"></div>
        </section>
    </main>

    <footer class="bg-gray-100 text-black py-6 mt-auto border-t border-gray-200 text-center text-xs uppercase tracking-widest font-bold">
        Delicias Kitchen Catering — Admin
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import {
            getFirestore, collection, query, orderBy, onSnapshot,
            addDoc, updateDoc, deleteDoc, doc, serverTimestamp, writeBatch
        } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC88JpbLzapZUcV-Y17Y9RUvwYuwSc2Dmw",
            authDomain: "delicias-4b2b1.firebaseapp.com",
            projectId: "delicias-4b2b1",
            storageBucket: "delicias-4b2b1.firebasestorage.app",
            messagingSenderId: "641583284059",
            appId: "1:641583284059:web:2801a9160f3333b833a47e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const menuRef = collection(db, "menuItems");

        /*
         * Firestore schema — collection "menuItems", one document per item:
         *   name:        string   — display name
         *   description: string   — shown under the name on the public menu
         *   price:       number   — dollars per plate
         *   category:    string   — "Mexican" | "BBQ" | "Italian" | "American" | "Continental" | ""
         *                           (used by the plate builder's pairing alerts)
         *   type:        string   — "main" | "side" | "appetizer" (which menu section)
         *   available:   boolean  — false hides the item from the public site without deleting it
         *   sortOrder:   number   — display order within its section
         *   createdAt:   timestamp
         *   updatedAt:   timestamp
         */

        let items = [];

        const banner = document.getElementById('status-banner');
        function showStatus(msg, isError = false) {
            banner.textContent = msg;
            banner.classList.remove('hidden');
            banner.classList.toggle('bg-black', isError);
            banner.classList.toggle('text-white', isError);
            banner.classList.toggle('bg-gray-100', !isError);
            clearTimeout(showStatus._t);
            showStatus._t = setTimeout(() => banner.classList.add('hidden'), 4000);
        }

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function renderLists() {
            const byType = { main: [], side: [], appetizer: [] };
            items.forEach(item => { if (byType[item.type]) byType[item.type].push(item); });

            for (const type of Object.keys(byType)) {
                const container = document.getElementById(`list-${type}`);
                if (byType[type].length === 0) {
                    container.innerHTML = `<p class="text-sm text-black/50 uppercase tracking-wider">No items yet.</p>`;
                    continue;
                }
                container.innerHTML = byType[type].map(item => `
                    <div class="border border-black/30 p-4 flex flex-col md:flex-row md:items-center gap-4 ${item.available === false ? 'bg-gray-100 opacity-60' : 'bg-white'}">
                        <div class="flex-grow">
                            <h4 class="font-bold uppercase tracking-wider">${escapeHtml(item.name)}
                                ${item.category ? `<span class="ml-2 text-xs font-normal text-black/60">[${escapeHtml(item.category)}]</span>` : ''}
                            </h4>
                            <p class="text-sm text-black/70">${escapeHtml(item.description)}</p>
                        </div>
                        <div class="flex items-center gap-3 flex-shrink-0">
                            <label class="flex items-center gap-1 text-xs font-bold uppercase cursor-pointer" title="Uncheck to hide from the public menu without deleting">
                                <input type="checkbox" ${item.available === false ? '' : 'checked'}
                                    onchange="setAvailable('${item.id}', this.checked)" class="accent-black w-4 h-4">
                                Live
                            </label>
                            <div class="flex items-center border border-black bg-white">
                                <span class="pl-2 text-sm font-bold">$</span>
                                <input type="number" min="0" step="0.5" value="${item.price}"
                                    id="price-${item.id}" class="w-20 p-2 text-sm">
                            </div>
                            <button onclick="savePrice('${item.id}')"
                                class="bg-black hover:bg-gray-800 text-white px-4 py-2 text-xs font-bold uppercase tracking-wider transition-colors">
                                Save
                            </button>
                            <button onclick="removeItem('${item.id}', '${escapeHtml(item.name).replace(/'/g, "\\'")}')"
                                class="border border-black hover:bg-black hover:text-white px-3 py-2 text-xs font-bold uppercase tracking-wider transition-colors">
                                Delete
                            </button>
                        </div>
                    </div>
                `).join('');
            }
            lucide.createIcons();
        }

        // Live subscription — keeps the page in sync as items change
        onSnapshot(query(menuRef, orderBy("sortOrder")), snap => {
            items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            document.getElementById('seed-panel').classList.toggle('hidden', !snap.empty);
            renderLists();
        }, err => {
            console.error(err);
            showStatus("Could not connect to the database. Check your Firestore rules.", true);
        });

        // --- Actions (exposed for inline onclick handlers) ---

        document.getElementById('add-form').addEventListener('submit', async e => {
            e.preventDefault();
            const name = document.getElementById('add-name').value.trim();
            const price = parseFloat(document.getElementById('add-price').value);
            if (!name || isNaN(price) || price < 0) {
                showStatus("Name and a valid price are required.", true);
                return;
            }
            const type = document.getElementById('add-type').value;
            const maxSort = Math.max(0, ...items.filter(i => i.type === type).map(i => i.sortOrder || 0));
            try {
                await addDoc(menuRef, {
                    name,
                    price,
                    type,
                    category: document.getElementById('add-category').value,
                    description: document.getElementById('add-description').value.trim(),
                    available: true,
                    sortOrder: maxSort + 10,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                });
                document.getElementById('add-form').reset();
                showStatus(`Added "${name}".`);
            } catch (err) {
                console.error(err);
                showStatus("Failed to add item.", true);
            }
        });

        window.savePrice = async (id) => {
            const price = parseFloat(document.getElementById(`price-${id}`).value);
            if (isNaN(price) || price < 0) {
                showStatus("Enter a valid price.", true);
                return;
            }
            try {
                await updateDoc(doc(db, "menuItems", id), { price, updatedAt: serverTimestamp() });
                showStatus("Price updated.");
            } catch (err) {
                console.error(err);
                showStatus("Failed to update price.", true);
            }
        };

        window.setAvailable = async (id, available) => {
            try {
                await updateDoc(doc(db, "menuItems", id), { available, updatedAt: serverTimestamp() });
                showStatus(available ? "Item is live." : "Item hidden from public menu.");
            } catch (err) {
                console.error(err);
                showStatus("Failed to update item.", true);
            }
        };

        window.removeItem = async (id, name) => {
            if (!confirm(`Delete "${name}" from the menu? This cannot be undone.`)) return;
            try {
                await deleteDoc(doc(db, "menuItems", id));
                showStatus(`Deleted "${name}".`);
            } catch (err) {
                console.error(err);
                showStatus("Failed to delete item.", true);
            }
        };

        // --- One-time seed from the original hardcoded site menu ---
        const defaultMenu = [
            { type: 'main', name: 'Carne Asada (Taquiza)', price: 15, category: 'Mexican', description: 'Authentic carne asada, fresh tortillas, salsas.' },
            { type: 'main', name: 'Chicken Poblano', price: 14, category: 'Mexican', description: 'Chicken breast in creamy roasted poblano sauce.' },
            { type: 'main', name: 'Sliced Brisket', price: 18, category: 'BBQ', description: 'Slow-cooked, tender sliced brisket.' },
            { type: 'main', name: 'Red Asado', price: 14, category: 'Mexican', description: 'Traditional pork in rich red chile sauce.' },
            { type: 'main', name: 'Spaghetti with Meatballs', price: 12, category: 'Italian', description: 'Classic pasta with savory meatballs.' },
            { type: 'side', name: 'Charro Beans', price: 3, category: 'Mexican', description: 'Pinto beans simmered with bacon and spices.' },
            { type: 'side', name: 'Cilantro Lime Rice', price: 3, category: 'Mexican', description: 'Fluffy white rice with fresh cilantro.' },
            { type: 'side', name: 'Loaded Mashed Potatoes', price: 5, category: 'American', description: 'With bacon, cheese, and chives.' },
            { type: 'side', name: 'Cambray Potatoes w/ Rosemary', price: 5, category: 'Continental', description: 'Roasted baby potatoes.' },
            { type: 'side', name: 'Macaroni Salad', price: 4, category: 'American', description: 'Classic creamy cold pasta salad.' },
            { type: 'side', name: 'Steamed Vegetables', price: 4, category: 'Continental', description: 'Fresh seasonal vegetable medley.' },
            { type: 'appetizer', name: 'Caprese Skewers', price: 5, category: '', description: 'Mozzarella, tomato, basil.' },
            { type: 'appetizer', name: 'Mini Burgers', price: 6, category: '', description: 'Bite-sized classic sliders.' },
            { type: 'appetizer', name: 'Shrimp Cocktail', price: 7, category: '', description: 'Served chilled with cocktail sauce.' }
        ];

        window.seedDefaults = async () => {
            const btn = document.getElementById('seed-btn');
            btn.disabled = true;
            btn.textContent = 'Loading...';
            try {
                const batch = writeBatch(db);
                defaultMenu.forEach((item, i) => {
                    batch.set(doc(menuRef), {
                        ...item,
                        available: true,
                        sortOrder: (i + 1) * 10,
                        createdAt: serverTimestamp(),
                        updatedAt: serverTimestamp()
                    });
                });
                await batch.commit();
                showStatus("Default menu loaded.");
            } catch (err) {
                console.error(err);
                showStatus("Failed to seed the menu.", true);
                btn.disabled = false;
                btn.textContent = 'Load Default Menu';
            }
        };

        lucide.createIcons();
    </script>
</body>
</html>
